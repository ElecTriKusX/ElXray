name: Prepare verified assets
description: Download packaging and test assets without relying on an upstream cache
inputs:
  windows:
    description: Include Wintun packaging files
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p resources
        fetch() { curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$1" -o "$2"; }
        for item in 'geoip/geoip-lite geoip' 'geosite/geosite geosite'; do
          read -r remote local <<< "$item"
          base="https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/${remote}.dat"
          fetch "$base" "resources/${local}.dat"
          fetch "${base}.sha256sum" "resources/${local}.sha256sum"
          digest=$(awk '{print $1}' "resources/${local}.sha256sum")
          [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s  %s\n' "$digest" "resources/${local}.dat" | sha256sum --check -
        done
    - if: inputs.windows == 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 https://www.wintun.net/builds/wintun-0.14.1.zip -o resources/wintun.zip
        echo '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  resources/wintun.zip' | sha256sum --check -
        unzip -q resources/wintun.zip -d resources
        test -s resources/wintun/bin/amd64/wintun.dll
        test -s resources/wintun/bin/x86/wintun.dll
        test -s resources/wintun/bin/arm64/wintun.dll
        rm resources/wintun.zip
